name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Test, Typecheck, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Architecture boundaries
        run: npm run check:architecture-boundaries

      - name: Finance domain contracts
        run: npm --workspace @vayada/domain-finance run test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Booking Admin tests
        run: npm --workspace vayada-booking-engine-frontend-admin run test

      - name: Booking Web tests
        run: npm --workspace vayada-booking-engine-frontend run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: "00000000000000000000000000000000"

      - name: Landing consent browser regressions
        run: |
          npx playwright install --with-deps chromium
          npm --workspace vayada-landing run start -- --port 3006 &
          landing_pid=$!
          trap 'kill "$landing_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3006/ >/dev/null; then break; fi
            sleep 1
          done
          npm run e2e:landing -- --workers=2
        env:
          CI: "false"
          E2E_START_SERVERS: "0"
          E2E_LANDING_BASE_URL: http://127.0.0.1:3006
          E2E_LANDING_ANALYTICS: "1"

  first_party_auth:
    name: First-Party Auth Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend domain packages
        run: |
          npm --workspace @vayada/domain-hotels run build
          npm --workspace @vayada/domain-booking run build
          npm --workspace @vayada/domain-marketplace run build
          npm --workspace @vayada/domain-pms run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify frontend auth gateways
        run: |
          npm --workspace vayada-creator-marketplace run test -- 'app/auth/[...path]/route.test.ts'
          npm --workspace vayada-booking-engine-frontend-admin run test -- 'app/auth/[...path]/route.test.ts'
          npm --workspace vayada-pms-frontend run test -- 'app/auth/[...path]/route.test.ts'
          npm --workspace vayada-affiliate-dashboard run test -- 'app/auth/[...path]/route.test.ts'
          npm --workspace vayada-admin run test -- 'app/auth/[...path]/route.test.ts'

      - name: Run first-party auth browser regressions
        run: npm run e2e:first-party-auth
        env:
          E2E_FIRST_PARTY_AUTH_ONLY: "1"
          E2E_START_SERVERS: "1"

  api_postgres:
    name: TypeScript API PostgreSQL Integration (PG${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: vayada_test
          POSTGRES_PASSWORD: vayada_test
          POSTGRES_DB: vayada_api_test
        options: >-
          --health-cmd "pg_isready -U vayada_test -d vayada_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Marketplace matching event storage
        run: npm --workspace @vayada/backend-migration run test -- --no-file-parallelism src/matchingEventProjections.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Apply target migrations
        run: npm --workspace @vayada/backend-migration run target:migrate -- --env local
        env:
          TARGET_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify hotel member role repair
        run: npm --workspace @vayada/backend-migration run test -- --no-file-parallelism src/hotelMemberRoleRepair.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify effective property access
        run: npm --workspace @vayada/backend-authorization run test -- --no-file-parallelism src/index.test.ts -t createPgPropertyAccessRepository
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Run PMS TypeScript PostgreSQL integration
        run: >-
          npm --workspace vayada-api run test --
          --no-file-parallelism
          src/marketplaceCollaborations.test.ts
          src/domains/pmsLinkedInventoryGroupRepository.integration.test.ts
          src/domains/pmsRoomFactsCommandRepository.integration.test.ts
          src/domains/pmsPhysicalRoomUnitReconcileRepository.integration.test.ts
          src/domains/pmsPhysicalRoomManagementRepository.integration.test.ts
          src/domains/pmsRoomPublicationCommandRepository.integration.test.ts
          src/domains/pmsCalendarAutoOpenSettingsRepository.integration.test.ts
          src/jobs/pmsChannexScheduler.integration.test.ts
          src/domains/pmsOperatingCalendarCommandRepository.integration.test.ts
          src/domains/pmsOperatingCalendarImpact.integration.test.ts
          src/domains/pmsManualBookingCommandRepository.integration.test.ts
          src/domains/bookingGuestPolicyRepository.integration.test.ts
          src/domains/financeOtaCommissionRuleRepository.integration.test.ts
          src/domains/financeExpenseCategoryRepository.integration.test.ts
          src/domains/financeManualExpenseRepository.integration.test.ts
          src/domains/financeRecurringExpenseRuleRepository.integration.test.ts
          src/domains/financeRecurringExpenseGeneration.integration.test.ts
          src/domains/financeExpenseReadModel.integration.test.ts
          src/domains/financeFolioCommandRepository.integration.test.ts
          src/domains/financeFolioReadRepository.integration.test.ts
          src/domains/financeProviderFeeEvidence.integration.test.ts
          src/domains/financeProviderFeeExpenseProjection.integration.test.ts
          src/domains/stripeProviderAccountReconciliation.integration.test.ts
          src/domains/financeGeneratedExpenseRepository.integration.test.ts
          src/domains/financeOtaCommissionExpenseProjection.integration.test.ts
          src/jobs/financeExpenseGeneration.integration.test.ts
          src/jobs/pmsChannexBookingRevisionTombstones.integration.test.ts
          src/jobs/channexBookings.integration.test.ts
          src/routes/bookingWebPublicAttribution.integration.test.ts
          src/jobs/financeSubscriptions.integration.test.ts
          src/platform/postgresRuntime.integration.test.ts
          src/platform/workosWebhooks.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify Booking add-on economics migration
        run: >-
          npm --workspace @vayada/backend-migration run test --
          --no-file-parallelism
          src/bookingAddonEconomics.test.ts
          src/pendingBookingEdits.integration.test.ts
          src/manualBookingReadiness.integration.test.ts
          src/workosBackfill.test.ts
          src/financeFolioRecipientCiphertextMigration.integration.test.ts
          src/channexBookingRevisionTombstonesMigration.integration.test.ts
          src/stripeWebhookReceiptRetention.integration.test.ts
          src/productionMediaMigration.integration.test.ts
          src/productionCatalogWriters.integration.test.ts
          src/productionBookingWriters.integration.test.ts
          src/productionPmsWriters.integration.test.ts
          src/productionCutover.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify Finance OTA commission migration
        run: >-
          npm --workspace @vayada/backend-migration run test --
          src/financeOtaCommissionRules.test.ts src/providerFeeEvidenceMigration.integration.test.ts && npm --workspace vayada-api run test -- src/domains/financeOtaCommissionEvidence.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Verify membership property scope migration
        run: >-
          npm --workspace @vayada/backend-migration run test --
          --no-file-parallelism src/membershipPropertyScope.test.ts
          src/membershipDelegations.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Run public gallery migration integration
        run: >-
          npm --workspace @vayada/backend-migration run test --
          src/publicBookabilityGalleryMedia.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Run pending booking edits in an isolated database
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_booking_edit_test
          TARGET_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_booking_edit_test
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const url = new URL(process.env.TEST_DATABASE_URL);
            url.pathname = "/postgres";
            const client = new pg.Client({ connectionString: url.href });
            await client.connect();
            await client.query("CREATE DATABASE vayada_booking_edit_test");
            await client.end();
          '
          npm --workspace @vayada/backend-migration run target:migrate -- --env local
          npm --workspace vayada-api run test -- --no-file-parallelism src/routes/pendingBookingEdits.integration.test.ts

  setup_draft_reset_postgres:
    name: Setup Draft Reset PostgreSQL ${{ matrix.postgres }} Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: vayada_test
          POSTGRES_PASSWORD: vayada_test
          POSTGRES_DB: vayada_api_test
        options: >-
          --health-cmd "pg_isready -U vayada_test -d vayada_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply target migrations
        run: npm --workspace @vayada/backend-migration run target:migrate -- --env local
        env:
          TARGET_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

      - name: Run setup draft reset integration
        run: >-
          npm --workspace vayada-api run test --
          --no-file-parallelism
          src/propertySetupDraftCommand.test.ts
        env:
          TEST_DATABASE_URL: postgresql://vayada_test:vayada_test@localhost:5432/vayada_api_test

  backend:
    name: Backend Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: marketplace-api
            app_dir: apps/marketplace-api
            db_user: vayada_user
            db_password: vayada_password
            db_name: vayada_db
            test_db_name: vayada_test_db
            db_port: 5432
            cors_origins: http://localhost:3000,http://localhost:3001
            frontend_url: http://localhost:3000
          - app: booking-api
            app_dir: apps/booking-api
            db_user: vayada_booking_user
            db_password: vayada_booking_password
            db_name: vayada_booking_db
            db_port: 5434
            cors_origins: http://localhost:3000,http://localhost:3002,http://localhost:3003,https://booking.tigalombok.com
          - app: pms-api
            app_dir: apps/pms-api
            db_user: vayada_pms_user
            db_password: vayada_pms_password
            db_name: vayada_pms_db
            db_port: 5436
            cors_origins: http://localhost:3002,http://localhost:3003

    defaults:
      run:
        working-directory: ${{ matrix.app_dir }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ matrix.db_user }}
          POSTGRES_PASSWORD: ${{ matrix.db_password }}
          POSTGRES_DB: ${{ matrix.db_name }}
        options: >-
          --health-cmd "pg_isready -U ${{ matrix.db_user }} -d ${{ matrix.db_name }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - ${{ matrix.db_port }}:5432

      auth-postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vayada_auth_user
          POSTGRES_PASSWORD: vayada_auth_password
          POSTGRES_DB: vayada_auth_db
        options: >-
          --health-cmd "pg_isready -U vayada_auth_user -d vayada_auth_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5435:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.app_dir }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up auth database schema
        working-directory: ${{ github.workspace }}
        run: |
          for i in {1..30}; do
            if PGPASSWORD=vayada_auth_password psql -h localhost -p 5435 -U vayada_auth_user -d vayada_auth_db -c '\q' 2>/dev/null; then
              break
            fi
            sleep 2
          done

          for f in auth-db/migrations/*.sql; do
            PGPASSWORD=vayada_auth_password psql -h localhost -p 5435 -U vayada_auth_user -d vayada_auth_db -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run app database migrations
        run: |
          for i in {1..30}; do
            if PGPASSWORD="${{ matrix.db_password }}" psql -h localhost -p "${{ matrix.db_port }}" -U "${{ matrix.db_user }}" -d "${{ matrix.db_name }}" -c '\q' 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [ "${{ matrix.app }}" = "marketplace-api" ]; then
            PGPASSWORD="${{ matrix.db_password }}" psql -h localhost -p "${{ matrix.db_port }}" -U "${{ matrix.db_user }}" -d "${{ matrix.db_name }}" -c "CREATE DATABASE ${{ matrix.test_db_name }};" || true
            PYTHONPATH=. python scripts/run_migrations.py
          else
            for f in migrations/*.sql; do
              PGPASSWORD="${{ matrix.db_password }}" psql -h localhost -p "${{ matrix.db_port }}" -U "${{ matrix.db_user }}" -d "${{ matrix.db_name }}" -f "$f"
            done
          fi
        env:
          DATABASE_URL: postgresql://${{ matrix.db_user }}:${{ matrix.db_password }}@localhost:${{ matrix.db_port }}/${{ matrix.test_db_name || matrix.db_name }}
          AUTH_DATABASE_URL: postgresql://vayada_auth_user:vayada_auth_password@localhost:5435/vayada_auth_db
          PYTHONPATH: .
          CORS_ORIGINS: ${{ matrix.cors_origins }}
          EMAIL_ENABLED: "true"
          DEBUG: "true"
          JWT_SECRET_KEY: test-secret-key-for-testing-only
          FRONTEND_URL: ${{ matrix.frontend_url || 'http://localhost:3000' }}

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://${{ matrix.db_user }}:${{ matrix.db_password }}@localhost:${{ matrix.db_port }}/${{ matrix.test_db_name || matrix.db_name }}
          AUTH_DATABASE_URL: postgresql://vayada_auth_user:vayada_auth_password@localhost:5435/vayada_auth_db
          TEST_DATABASE_URL: postgresql://${{ matrix.db_user }}:${{ matrix.db_password }}@localhost:${{ matrix.db_port }}/${{ matrix.test_db_name || matrix.db_name }}
          MARKETPLACE_DATABASE_URL: ""
          PMS_API_URL: http://localhost:8002
          CORS_ORIGINS: ${{ matrix.cors_origins }}
          EMAIL_ENABLED: "true"
          DEBUG: "true"
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key-for-testing-only
          FRONTEND_URL: ${{ matrix.frontend_url || 'http://localhost:3000' }}
          SMTP_HOST: ""
          S3_BUCKET_NAME: test-bucket
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test-access-key
          AWS_SECRET_ACCESS_KEY: test-secret-key

  required:
    name: Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - frontend
      - first_party_auth
      - api_postgres
      - setup_draft_reset_postgres
      - backend
    if: always()

    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.first_party_auth.result }}" != "success" ] || [ "${{ needs.api_postgres.result }}" != "success" ] || [ "${{ needs.setup_draft_reset_postgres.result }}" != "success" ] || [ "${{ needs.backend.result }}" != "success" ]; then
            echo "Frontend result: ${{ needs.frontend.result }}"
            echo "First-party auth result: ${{ needs.first_party_auth.result }}"
            echo "TypeScript API PostgreSQL result: ${{ needs.api_postgres.result }}"
            echo "Setup Draft Reset PostgreSQL result: ${{ needs.setup_draft_reset_postgres.result }}"
            echo "Backend result: ${{ needs.backend.result }}"
            exit 1
          fi
