name: Deploy Next Booking Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/booking-web/**"
      - ".github/workflows/deploy-next-booking-web.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-next-booking-web-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: vayada-next-booking-frontend
  AWS_ACCOUNT_ID: 269416271598
  APP_DIR: apps/booking-web
  NEXT_API_URL: https://next-api.vayada.com

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ env.APP_DIR }}
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_BOOKING_WEB_API_URL=${{ env.NEXT_API_URL }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_API_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_live_51T4q9THtaQeEOmq25xCQRtxOCZ7WKDN8Bpmo2jMuQCKGLPxjoU7cApWRR0fysdKgxjLsEs7zoL00qaAB6boaNMC600tH1jDPWD
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:next-latest
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:next-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch deploy to platform
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          repository: vayada-marketplace/vayada-platform
          event-type: app-image-published
          client-payload: |
            {
              "service": "next-booking-frontend",
              "ecr_repo": "${{ env.ECR_REPOSITORY }}",
              "image_sha": "next-${{ github.sha }}",
              "environment": "next"
            }
