name: Recover Booking Web

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Approved source commit to rebuild
        required: true
        default: c879df4fb2b207ff69eb87442743aee7e42536ff
      image_tag:
        description: Immutable production recovery tag
        required: true
        default: prod-recovery-c879df4-pms-url

permissions:
  id-token: write
  contents: read

concurrency:
  group: recover-booking-web-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: vayada-booking-frontend
  AWS_ACCOUNT_ID: 269416271598
  APP_DIR: apps/booking-web
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  build-and-deploy:
    name: Rebuild and deploy canonical Booking image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify immutable recovery tag is unused
        shell: bash
        run: |
          if [[ ! "${IMAGE_TAG}" =~ ^prod-recovery-[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid recovery image tag '${IMAGE_TAG}'."
            exit 1
          fi

          set +e
          output="$(
            aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids "imageTag=${IMAGE_TAG}" 2>&1
          )"
          result=$?
          set -e

          if [ "${result}" -eq 0 ]; then
            echo "::error::Recovery image tag '${IMAGE_TAG}' already exists."
            exit 1
          fi

          if ! grep -q "ImageNotFoundException" <<<"${output}"; then
            echo "${output}"
            exit "${result}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable production image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ env.APP_DIR }}
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_BOOKING_WEB_API_URL=https://booking-api.vayada.com
            NEXT_PUBLIC_API_URL=https://booking-api.vayada.com
            NEXT_PUBLIC_PMS_URL=https://pms-api.vayada.com
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_live_51T4q9THtaQeEOmq25xCQRtxOCZ7WKDN8Bpmo2jMuQCKGLPxjoU7cApWRR0fysdKgxjLsEs7zoL00qaAB6boaNMC600tH1jDPWD
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch canonical Booking deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          repository: vayada-marketplace/vayada-platform
          event-type: app-image-published
          client-payload: |
            {
              "service": "booking-frontend",
              "ecr_repo": "${{ env.ECR_REPOSITORY }}",
              "image_sha": "${{ env.IMAGE_TAG }}",
              "environment": "production"
            }
