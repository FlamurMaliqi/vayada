name: Deploy Next TypeScript API

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to shared next after building (disable for isolated staging)"
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/**"
      - "scripts/start-next-api.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-next-api.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-next-api-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: vayada-next-api
  AWS_ACCOUNT_ID: 269416271598
  APP_DIR: apps/api

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ env.APP_DIR }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            API_RUNTIME=next
            APPLICATION_RELEASE=${{ github.sha }}
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:next-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}.dkr.ecr.{1}.amazonaws.com/{2}:next-latest', env.AWS_ACCOUNT_ID, env.AWS_REGION, env.ECR_REPOSITORY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch deploy to platform
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          repository: vayada-marketplace/vayada-platform
          event-type: app-image-published
          client-payload: |
            {
              "service": "next-target-backend",
              "ecr_repo": "${{ env.ECR_REPOSITORY }}",
              "image_sha": "next-${{ github.sha }}",
              "environment": "next"
            }
