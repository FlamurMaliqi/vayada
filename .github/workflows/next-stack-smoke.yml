name: Next-stack onboarding and checkout smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-stack-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify deployed next stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: next-smoke
    env:
      CI: "true"
      E2E_NEXT_STACK_SMOKE: "1"
      NEXT_STACK_SMOKE_ENV: next
      NEXT_STACK_SMOKE_ALLOW_LIVE_WORKOS: "1"
      NEXT_STACK_SMOKE_EMAIL_DOMAIN: ${{ vars.NEXT_STACK_SMOKE_EMAIL_DOMAIN }}
      NEXT_STACK_SMOKE_PASSWORD: ${{ secrets.NEXT_STACK_SMOKE_PASSWORD }}
      WORKOS_API_KEY: ${{ secrets.NEXT_STACK_SMOKE_WORKOS_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run next-stack smoke
        run: npm run e2e:next-stack-smoke
