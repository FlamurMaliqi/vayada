name: Deploy Next PMS Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/pms-web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-next-pms-web.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-next-pms-web-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: vayada-next-pms-frontend
  AWS_ACCOUNT_ID: 269416271598
  APP_DIR: apps/pms-web
  NEXT_API_URL: https://next-api.vayada.com
  NEXT_BOOKING_ADMIN_URL: https://next-booking-admin.vayada.com
  NEXT_MARKETPLACE_URL: https://next-marketplace.vayada.com

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::269416271598:role/vayada-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ env.APP_DIR }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_AUTH_API_URL=${{ env.NEXT_API_URL }}
            NEXT_PUBLIC_PMS_API_URL=${{ env.NEXT_API_URL }}
            NEXT_PUBLIC_PMS_OPERATIONS_API_URL=${{ env.NEXT_API_URL }}
            NEXT_PUBLIC_PLATFORM_MEDIA_API_URL=${{ env.NEXT_API_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_BROWSER_API_KEY }}
            NEXT_PUBLIC_BOOKING_ADMIN_URL=${{ env.NEXT_BOOKING_ADMIN_URL }}
            NEXT_PUBLIC_MARKETPLACE_URL=${{ env.NEXT_MARKETPLACE_URL }}
            NEXT_PUBLIC_AUTHKIT_LOGIN_ENABLED=true
            NEXT_PUBLIC_AUTHKIT_COMPATIBILITY_TOKEN_ENABLED=false
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:next-latest
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:next-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch deploy to platform
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          repository: vayada-marketplace/vayada-platform
          event-type: app-image-published
          client-payload: |
            {
              "service": "next-pms-frontend",
              "ecr_repo": "${{ env.ECR_REPOSITORY }}",
              "image_sha": "next-${{ github.sha }}",
              "environment": "next"
            }
