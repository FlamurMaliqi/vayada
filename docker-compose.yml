###############################################################################
# vayada — Local Support Services
#
# Starts local databases, MinIO, auth-DB migrations, and legacy FastAPI backends.
# Next.js frontends and apps/api run from the npm workspace / portless so local
# @vayada/* workspace packages resolve from the repo root.
#
# Usage:
#   docker compose up              # start support services
#   docker compose up -d           # start in background
#   docker compose down            # stop everything
#   docker compose down -v         # stop and remove volumes
#
# Ports:
#   8000  Marketplace backend API
#   8001  Booking engine backend API
#   8002  PMS backend API
#   5432  Marketplace PostgreSQL
#   5434  Booking engine PostgreSQL
#   5435  Auth PostgreSQL (shared)
#   5436  PMS PostgreSQL
#   9000  MinIO S3 API
#   9001  MinIO console
###############################################################################

services:
  # ─── Databases ─────────────────────────────────────────────────────────

  marketplace-postgres:
    image: postgres:15-alpine
    container_name: vayada-marketplace-postgres
    environment:
      POSTGRES_USER: vayada_user
      POSTGRES_PASSWORD: vayada_password
      POSTGRES_DB: vayada_db
    ports:
      - "5432:5432"
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayada_user -d vayada_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vayada-network

  booking-postgres:
    image: postgres:15-alpine
    container_name: vayada-booking-postgres
    environment:
      POSTGRES_USER: vayada_booking_user
      POSTGRES_PASSWORD: vayada_booking_password
      POSTGRES_DB: vayada_booking_db
    ports:
      - "5434:5432"
    volumes:
      - booking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayada_booking_user -d vayada_booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vayada-network

  auth-postgres:
    image: postgres:15-alpine
    container_name: vayada-auth-postgres
    environment:
      POSTGRES_USER: vayada_auth_user
      POSTGRES_PASSWORD: vayada_auth_password
      POSTGRES_DB: vayada_auth_db
    ports:
      - "5435:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayada_auth_user -d vayada_auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vayada-network

  pms-postgres:
    image: postgres:15-alpine
    container_name: vayada-pms-postgres
    environment:
      POSTGRES_USER: vayada_pms_user
      POSTGRES_PASSWORD: vayada_pms_password
      POSTGRES_DB: vayada_pms_db
    ports:
      - "5436:5432"
    volumes:
      - pms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayada_pms_user -d vayada_pms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vayada-network

  # ─── Auth DB Migrations ───────────────────────────────────────────────
  # The auth DB is shared infra that no single backend owns, so it needs
  # its own one-shot migration runner. Without this, fresh DB volumes
  # have no `users` table and login/register fails with 500.

  auth-db-migrate:
    image: python:3.11-alpine
    container_name: vayada-auth-db-migrate
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vayada_auth_user:vayada_auth_password@auth-postgres:5432/vayada_auth_db
    volumes:
      - ./auth-db:/auth-db
    working_dir: /auth-db
    command: sh -c "pip install -q asyncpg && python scripts/run_migrations.py"
    networks:
      - vayada-network
    restart: "no"

  # ─── Object Storage (Marketplace) ─────────────────────────────────────

  minio:
    image: minio/minio:latest
    container_name: vayada-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vayada-network

  minio-setup:
    image: minio/mc:latest
    container_name: vayada-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "set -e; mc alias set local http://minio:9000 minioadmin minioadmin; mc mb --ignore-existing local/vayada-uploads; mc anonymous set download local/vayada-uploads; mc mb --ignore-existing local/vayada-media-local; mc anonymous set-json /config/local-media-public-policy.json local/vayada-media-local"
    volumes:
      - ./scripts/local-media-public-policy.json:/config/local-media-public-policy.json:ro
    networks:
      - vayada-network

  media-cdn:
    image: nginx:alpine
    container_name: vayada-media-cdn
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "9002:80"
    volumes:
      - ./scripts/local-media-cdn.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - vayada-network

  # ─── Marketplace Backend ───────────────────────────────────────────────

  marketplace-backend:
    build:
      context: ./apps/marketplace-api
      dockerfile: Dockerfile
    container_name: vayada-marketplace-backend
    ports:
      - "8000:8000"
    depends_on:
      marketplace-postgres:
        condition: service_healthy
      auth-postgres:
        condition: service_healthy
      pms-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth-db-migrate:
        condition: service_completed_successfully
    env_file:
      - path: ./apps/marketplace-api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://vayada_user:vayada_password@marketplace-postgres:5432/vayada_db
      AUTH_DATABASE_URL: postgresql://vayada_auth_user:vayada_auth_password@auth-postgres:5432/vayada_auth_db
      PMS_DATABASE_URL: postgresql://vayada_pms_user:vayada_pms_password@pms-postgres:5432/vayada_pms_db
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3003
      S3_BUCKET_NAME: vayada-uploads
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_USE_PUBLIC_URLS: "true"
    volumes:
      - ./apps/marketplace-api/app:/app/app
      - ./apps/marketplace-api/scripts:/app/scripts
    restart: unless-stopped
    networks:
      - vayada-network

  # ─── Booking Engine Backend ────────────────────────────────────────────

  booking-backend:
    build:
      context: ./apps/booking-api
      dockerfile: Dockerfile
    container_name: vayada-booking-backend
    ports:
      - "8001:8001"
    depends_on:
      booking-postgres:
        condition: service_healthy
      auth-postgres:
        condition: service_healthy
      marketplace-postgres:
        condition: service_healthy
      auth-db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://vayada_booking_user:vayada_booking_password@booking-postgres:5432/vayada_booking_db
      AUTH_DATABASE_URL: postgresql://vayada_auth_user:vayada_auth_password@auth-postgres:5432/vayada_auth_db
      MARKETPLACE_DATABASE_URL: postgresql://vayada_user:vayada_password@marketplace-postgres:5432/vayada_db
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      JWT_SECRET_KEY: your-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      CORS_ORIGINS: http://localhost:3002,http://localhost:3003,http://localhost:3004
      API_PORT: "8001"
      DEBUG: "true"
    volumes:
      - ./apps/booking-api/app:/app/app
    restart: unless-stopped
    networks:
      - vayada-network

  # ─── PMS Backend ──────────────────────────────────────────────────────

  pms-backend:
    build:
      context: ./apps/pms-api
      dockerfile: Dockerfile
    container_name: vayada-pms-backend
    ports:
      - "8002:8002"
    depends_on:
      pms-postgres:
        condition: service_healthy
      auth-postgres:
        condition: service_healthy
      booking-postgres:
        condition: service_healthy
      auth-db-migrate:
        condition: service_completed_successfully
    env_file:
      - path: ./apps/pms-api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://vayada_pms_user:vayada_pms_password@pms-postgres:5432/vayada_pms_db
      AUTH_DATABASE_URL: postgresql://vayada_auth_user:vayada_auth_password@auth-postgres:5432/vayada_auth_db
      BOOKING_ENGINE_DATABASE_URL: postgresql://vayada_booking_user:vayada_booking_password@booking-postgres:5432/vayada_booking_db
      BOOKING_ENGINE_API_URL: http://booking-backend:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      JWT_SECRET_KEY: your-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      CORS_ORIGINS: http://localhost:3002,http://localhost:3003,http://localhost:3004
      API_HOST: "0.0.0.0"
      API_PORT: "8002"
      DEBUG: "true"
      S3_BUCKET_NAME: vayada-uploads
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_USE_PUBLIC_URLS: "true"
    volumes:
      - ./apps/pms-api/app:/app/app
      - ./apps/pms-api/scripts:/app/scripts
    restart: unless-stopped
    networks:
      - vayada-network

volumes:
  marketplace_postgres_data:
  booking_postgres_data:
  auth_postgres_data:
  pms_postgres_data:
  minio_data:

networks:
  vayada-network:
    driver: bridge
